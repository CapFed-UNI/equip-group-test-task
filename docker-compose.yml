services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: catalog-app
    volumes:
      - .:/var/www/html
      - composer_cache:/tmp/composer-cache
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: catalog
      DB_USERNAME: catalog
      DB_PASSWORD: secret
      CATALOG_SEED: ${CATALOG_SEED:-faker}
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - catalog

  nginx:
    image: nginx:1.27-alpine
    container_name: catalog-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - catalog

  mysql:
    image: mysql:8.0
    container_name: catalog-mysql
    environment:
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - catalog

networks:
  catalog:

volumes:
  mysql_data:
  composer_cache:
